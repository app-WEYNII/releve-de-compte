<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Mes Finances"/>
  <meta name="theme-color" content="#FAF7F2" media="(prefers-color-scheme: light)"/>
  <meta name="theme-color" content="#161311" media="(prefers-color-scheme: dark)"/>
  <title>Mes Finances</title>
  <link rel="manifest" href="./manifest.json"/>
  <link rel="apple-touch-icon" href="./icon-192.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Source+Sans+3:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
:root{
  --bg:#FAF7F2;--card:#FFFFFF;--sunk:#F3EEE7;--line:#ECE5DB;--line-strong:#D9CFC2;
  --ink:#2B2520;--ink2:#5C534A;--ink3:#958A80;
  --accent:#C47B5A;--accent2:#A85D3F;--accent-soft:#F6E9E1;
  --green:#2F8566;--green-soft:#E6F3EC;--red:#C04F4F;--red-soft:#FBECEB;--warn:#D9902B;--warn-soft:#FBF1E1;
  --shadow:0 1px 2px rgba(43,37,32,.04),0 4px 16px rgba(43,37,32,.05);
  --r:20px;--r-sm:13px;
  --serif:"Fraunces",Georgia,serif;--sans:"Source Sans 3",-apple-system,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#161311;--card:#211D1A;--sunk:#2A2522;--line:#332D29;--line-strong:#4A423C;
  --ink:#F2ECE4;--ink2:#C9BFB4;--ink3:#8E8379;
  --accent:#DB9573;--accent2:#E8A684;--accent-soft:#3A2A22;
  --green:#5DBE96;--green-soft:#1D3229;--red:#E57B7B;--red-soft:#3A2222;--warn:#E8A94D;--warn-soft:#3A2E1C;
  --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark;
}}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:inherit}
input,select{font:inherit;color:inherit}
@supports (-webkit-touch-callout:none){input,select,textarea{font-size:16px!important}}
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;transition:opacity .35s}
#splash.hide{opacity:0;pointer-events:none}
.sp-ico{width:64px;height:64px;border-radius:20px;background:var(--accent);color:#fff;font:800 34px var(--serif);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.sp-t{font:800 24px var(--serif);letter-spacing:-.5px}

.app{max-width:560px;margin:0 auto;min-height:100vh}
main{padding:0 16px calc(96px + env(safe-area-inset-bottom))}
.view{animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:flex-end;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top)) 4px 14px}
.top h1{font:800 28px/1.1 var(--serif);letter-spacing:-.6px}
.eyebrow{font-size:12.5px;font-weight:700;color:var(--ink3);margin-bottom:2px}
h3{font-size:14.5px;font-weight:800;letter-spacing:-.1px}
.muted{color:var(--ink3)}.small{font-size:12.5px}.center{text-align:center;margin-top:24px}
.pos{color:var(--green)}.neg{color:var(--red)}.warn-t{color:var(--warn)}

/* Hero */
.hero{background:var(--card);border-radius:24px;padding:20px 20px 16px;box-shadow:var(--shadow);margin-bottom:14px;border:1px solid var(--line)}
.hero-label{font-size:13px;font-weight:700;color:var(--ink3)}
.hero-amt{font:800 40px/1.1 var(--serif);letter-spacing:-1.2px;margin:4px 0 10px;font-variant-numeric:tabular-nums}
.hero-amt.neg{color:var(--red)}
.hero-fc{display:inline-flex;align-items:center;gap:8px;background:var(--accent-soft);color:var(--accent2);padding:7px 12px;border-radius:999px;font-size:13px;font-weight:600}
.hero-fc strong{font-weight:800;font-variant-numeric:tabular-nums}
.fc-detail{margin-top:12px;background:var(--sunk);border-radius:var(--r-sm);padding:12px 14px;font-size:13.5px}
.fc-detail>div{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-variant-numeric:tabular-nums}
.fc-detail>div>span:last-child{font-weight:700;white-space:nowrap}
.fc-detail small{display:block;font-size:11.5px;color:var(--ink3)}
.fc-next{border-top:1px dashed var(--line-strong);margin-top:6px;padding-top:9px!important}
.fc-detail p{margin-top:8px}
.hero-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.hero-row>div{font-size:12.5px;color:var(--ink3);font-weight:600}
.hero-row strong{display:block;font:700 18px var(--serif);margin-top:2px;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.dot.pos{background:var(--green)}.dot.neg{background:var(--red)}

/* Cards */
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px;border:1px solid var(--line)}
.card.flush{padding:4px 6px}
.card-hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.pill{font-size:12px;font-weight:800;background:var(--sunk);padding:3px 9px;border-radius:999px;color:var(--ink2)}
.progress{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.progress>div{height:100%;background:var(--green);border-radius:99px;transition:width .4s}

.cat-dot{border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tx{display:flex;align-items:center;gap:12px;width:100%;padding:9px 8px;border-radius:12px}
.tx:active{background:var(--sunk)}
.tx-body{flex:1;min-width:0;text-align:left}
.tx-name{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-sub{font-size:12.5px;color:var(--ink3);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tx-sub.late{color:var(--warn);font-weight:600}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14.5px}
.amt.pos{color:var(--green)}.amt.neg{color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--sunk);color:var(--ink2)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.ok{background:var(--green-soft);color:var(--green)}

.rec-row{display:flex;align-items:center;gap:6px;margin-top:8px}
.rec-main{display:flex;align-items:center;gap:12px;flex:1;min-width:0;padding:6px;border-radius:12px}
.rec-main:active{background:var(--sunk)}
.quick{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--green);color:var(--green);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.quick:active{background:var(--green);color:#fff}
.rec-done{display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 6px;color:var(--green)}
.rec-done span:nth-child(2){flex:1;color:var(--ink2)}
.link-btn{color:var(--accent2);font-weight:700;font-size:13px;padding:8px 6px 2px;display:inline-flex;align-items:center;gap:5px}

.insight{display:flex;align-items:center;gap:12px;padding:9px 2px;font-size:13.5px;width:100%;text-align:left;border-top:1px solid var(--line)}
.card-hdr+.insight{border-top:none}
.insight small{display:block;font-size:12px;color:var(--ink3);margin-top:1px}
.insight>div{flex:1}
.ins-ico{width:30px;height:30px;border-radius:10px;background:var(--sunk);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:800;color:var(--ink2)}
.ins-ico.neg{background:var(--red-soft);color:var(--red)}.ins-ico.pos{background:var(--green-soft);color:var(--green)}.ins-ico.warn{background:var(--warn-soft);color:var(--warn)}
.mini{font-size:12.5px;font-weight:700;padding:7px 11px;border-radius:10px;background:var(--accent);color:#fff;white-space:nowrap}
.mini.ghost{background:var(--sunk);color:var(--ink2)}.mini.danger{background:var(--red)}

.lim{margin-bottom:10px}.lim-top{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:5px;font-variant-numeric:tabular-nums}

.svg-val{font:700 9px var(--sans);fill:var(--ink2)}
.svg-lbl{font:600 9px var(--sans);fill:var(--ink3)}
.svg-big{font:800 22px var(--serif);fill:var(--ink)}

/* Tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center;max-width:560px;margin:0 auto;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tabbar>button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:700;color:var(--ink3);padding:6px 0;position:relative}
.tabbar>button.on{color:var(--accent2)}
.tabbar .fab{width:56px;height:56px;border-radius:18px;background:var(--accent);color:#fff;justify-self:center;margin-top:-26px;box-shadow:0 8px 20px rgba(196,123,90,.4);justify-content:center;padding:0}
.tabbar .fab:active{transform:scale(.95)}
.nav-dot{position:absolute;top:5px;right:calc(50% - 15px);width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--card)}

/* Sheet */
.overlay{position:fixed;inset:0;background:rgba(20,15,12,.42);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fadeo .2s}
@keyframes fadeo{from{opacity:0}}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;border-radius:26px 26px 0 0;display:flex;flex-direction:column;animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:38px;height:5px;border-radius:9px;background:var(--line-strong);margin:8px auto 0}
.sheet-hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 6px}
.sheet-hdr h2{font:800 20px var(--serif);letter-spacing:-.3px}
.sheet-body{overflow-y:auto;padding:4px 18px calc(22px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.icon-btn{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:var(--ink2);background:var(--sunk)}
.icon-btn:disabled{opacity:.3}

/* Form */
.form{display:flex;flex-direction:column;gap:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:13px;padding:4px;gap:4px}
.seg button{padding:9px;border-radius:10px;font-weight:700;font-size:14px;color:var(--ink3);text-align:center}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.seg button.on.neg{color:var(--red)}.seg button.on.pos{color:var(--green)}
.seg.big{margin-bottom:12px}
.amount-field{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:4px 0}
.amount-field input{font:800 44px var(--serif)!important;letter-spacing:-1px;width:100%;max-width:260px;text-align:right;border:none;background:none;outline:none;font-variant-numeric:tabular-nums}
.amount-field input.neg{color:var(--ink)}.amount-field input.pos{color:var(--green)}
.amount-field span{font:700 26px var(--serif);color:var(--ink3)}
.fg{display:flex;flex-direction:column;gap:7px}
.fl{font-size:12.5px;font-weight:700;color:var(--ink2)}
.fl .auto{color:var(--accent2);font-weight:600}
.fi{width:100%;padding:12px 14px;border-radius:13px;border:1.5px solid var(--line);background:var(--bg);outline:none;font-size:15px}
.fi:focus{border-color:var(--accent)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sugg{display:flex;flex-direction:column;gap:4px;background:var(--sunk);border-radius:13px;padding:5px}
.sugg-chip{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;font-size:14px}
.sugg-chip:active,.sugg-chip:hover{background:var(--card)}
.sugg-name{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sugg-amt{color:var(--ink3);font-size:13px;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:7px;align-items:center}
.chips.wrap{flex-wrap:wrap}
.chips.scroll{overflow-x:auto;margin:0 -16px 12px;padding:2px 16px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--line);background:var(--card);padding:7px 12px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;flex-shrink:0}
.chip.on{color:#fff}
.chip.on.solid{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.ghost{background:none;border-style:dashed;color:var(--ink3)}
.date-chip{padding:6px 10px;min-width:0;flex:1;background:var(--card)}
.toggle-block{background:var(--sunk);border-radius:13px;padding:10px 12px}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:600;font-size:14px;padding:6px 0}
.switch-row span{display:inline-flex;align-items:center;gap:7px}
.switch-row input,.switch{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:99px;background:var(--line-strong);position:relative;transition:background .2s;flex-shrink:0;cursor:pointer}
.switch-row input::after,.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch-row input:checked,.switch:checked{background:var(--green)}
.switch-row input:checked::after,.switch:checked::after{transform:translateX(18px)}
.toggle-block .fr{margin-top:6px}.toggle-block .fi{background:var(--card)}
.link-list{display:flex;flex-direction:column;gap:6px}
.link-item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);font-size:13.5px}
.link-item small{display:block;color:var(--ink3);font-size:11.5px}
.link-item.on{border-color:var(--green);background:var(--green-soft)}
.link-item.hint{border-color:var(--green);border-style:dashed}
.li-a{font-weight:700;white-space:nowrap;color:var(--green)}
.batch-info{background:var(--green-soft);color:var(--green);font-size:13px;font-weight:600;padding:9px 12px;border-radius:12px;display:flex;gap:6px;align-items:center}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:14px;border-radius:14px;font-weight:700;font-size:15px;text-align:center}
.btn+.btn{margin-top:8px}
.btn:disabled{opacity:.45}
.btn-p{background:var(--accent);color:#fff}
.btn-p:active{background:var(--accent2)}
.btn-s{background:var(--sunk);color:var(--ink)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger-ghost{color:var(--red);background:var(--red-soft);margin-top:8px}
.btn-row{display:flex;gap:8px}.btn-row .btn{margin-top:0}
.btn-row .btn-p{flex:1.4}
.btn-text{color:var(--ink3);font-weight:600;font-size:14px;text-align:center;padding:4px}
.edit-extra{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px}

/* Opérations */
.month-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.month-label{position:relative;display:flex;align-items:center;gap:6px;font:700 17px var(--serif);padding:6px 12px;border-radius:12px}
.month-label select{position:absolute;inset:0;opacity:0;cursor:pointer}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:0 12px;margin-bottom:10px;color:var(--ink3)}
.search input{flex:1;border:none;background:none;outline:none;padding:11px 0;color:var(--ink)}
.sum-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.sum-row>div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 11px}
.sum-row small{display:block;font-size:11.5px;color:var(--ink3);font-weight:700}
.sum-row strong{font-size:14.5px;font-variant-numeric:tabular-nums}
.day{margin-bottom:6px}
.day-hdr{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--ink3);padding:8px 6px 6px;font-variant-numeric:tabular-nums}

.day .card{margin-bottom:6px}
.empty{text-align:center;color:var(--ink3);padding:40px 0;font-weight:600}
.cm-row{display:flex;align-items:center;gap:10px;width:100%;padding:6px 6px;border-radius:9px;font-size:13px}
.cm-row.on{background:var(--sunk);font-weight:800}
.cm-m{width:62px;color:var(--ink2);font-weight:600}
.cm-bar{flex:1;height:7px;background:var(--sunk);border-radius:9px;overflow:hidden}
.cm-bar span{display:block;height:100%;border-radius:9px}
.cm-v{width:70px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

/* Analyse */
.legend{margin-top:10px}
.leg-row{display:flex;align-items:center;gap:9px;width:100%;padding:7px 6px;border-radius:9px;font-size:13.5px}
.leg-row.on{background:var(--sunk)}
.leg-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.leg-name{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leg-pct{color:var(--ink3);font-size:12px;font-weight:700;width:38px;text-align:right}
.leg-v{font-weight:700;font-variant-numeric:tabular-nums;width:92px;text-align:right}
.leg-v small{color:var(--ink3);font-weight:600}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) 64px 92px;gap:8px;padding:7px 0;font-size:13.5px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.card-hdr+.cmp{border-top:none}
.cmp>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cmp-a{text-align:right;font-weight:700}.cmp-d{text-align:right;font-weight:700;font-size:12.5px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.heat-dow{font-size:10px;font-weight:800;color:var(--ink3);text-align:center}
.heat-cell{aspect-ratio:1;border-radius:8px;font-size:11px;font-weight:700;text-align:center;border:2px solid transparent}
.heat-cell.sel{border-color:var(--ink)}
.heat-list{margin-top:10px;font-size:13px}
.heat-list>div{display:flex;justify-content:space-between;padding:5px 2px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.score{display:flex;gap:16px;align-items:center}
.score-ring{width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.score-ring>div{width:74px;height:74px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-ring strong{font:800 28px/1 var(--serif)}.score-ring small{font-size:11px;color:var(--ink3);font-weight:700}
.score-d{font-size:13px;display:flex;flex-direction:column;gap:3px}
.score-d span{color:var(--ink2)}
.score-l{font:800 17px var(--serif);margin-bottom:2px}
.ana-detail{font-size:13px;font-weight:600;color:var(--ink2);margin:-4px 0 6px;min-height:18px;font-variant-numeric:tabular-nums}
.top-row{position:relative;display:flex;align-items:center;gap:9px;padding:7px 9px;margin-bottom:3px;border-radius:9px;overflow:hidden;font-size:13.5px}
.top-fill{position:absolute;left:0;top:0;bottom:0;border-radius:9px}
.top-row>*:not(.top-fill){position:relative}
.top-rank{font-size:11px;font-weight:800;color:var(--ink3);width:14px}
.top-name{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-v{font-weight:700;width:64px;text-align:right;font-variant-numeric:tabular-nums}
.wd{display:flex;align-items:flex-end;gap:8px;height:140px}
.wd-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.wd-bar{width:100%;border-radius:7px 7px 3px 3px;display:block}
